spring.application.name=core-banking-service
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/core_banking
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Without this, ResponseStatusException messages (e.g. "Insufficient
# balance...") are stripped from the JSON error body by default, and
# clients only see a bare status code with no explanation.
server.error.include-message=always
