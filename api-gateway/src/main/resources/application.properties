spring.application.name=api-gateway
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webflux.routes[1].id=core-banking-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://core-banking-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/accounts/**

spring.cloud.gateway.server.webflux.routes[2].id=fund-transfer-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://fund-transfer-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/transfers/**

spring.cloud.gateway.server.webflux.routes[3].id=utility-payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://utility-payment-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payments/**

spring.cloud.gateway.server.webflux.routes[4].id=ai-rag-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ai-rag-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/ai/**

spring.cloud.gateway.server.webflux.routes[5].id=auth-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/auth/**

# Frontend origin allowed to call the gateway (CORS is enforced in CorsConfig.java, not here)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173